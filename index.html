<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kedatangan Pakan</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1e38">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kedatangan Pakan">
  <link rel="apple-touch-icon" href="icon-192.png">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-main: #1e1e38;
      --bg-card: #28294a;
      --bg-card-header: #353660;
      --text-main: #ffffff;
      --text-muted: #a0a0c0;
      --accent-cyan: #00e5ff;
      --accent-orange: #ff9100;
      --accent-red: #ff5252;
      --accent-yellow: #ffff00;
      --border-color: #3f4069;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Courier New", monospace;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      padding: 8px;
      overflow-x: hidden;
      letter-spacing: 1px;
    }

    .header-title {
      position: relative;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 5px;
      margin-bottom: 10px;
      color: #ffffff;
      text-shadow:
        0 0 5px #00e5ff,
        0 0 10px #00e5ff,
        0 0 20px #00e5ff;
      animation: electricTitle 1.8s infinite;
    }

    .header-title::before,
    .header-title::after {
      content: "KEDATANGAN PAKAN";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      opacity: 0.6;
      pointer-events: none;
    }

    .header-title::before {
      color: #00e5ff;
      transform: translateX(-2px);
      animation: glitch1 1.3s infinite;
    }

    .header-title::after {
      color: #ff5252;
      transform: translateX(2px);
      animation: glitch2 1.1s infinite;
    }

    @keyframes electricTitle {
      0%,100% {
        text-shadow:
          0 0 5px #00e5ff,
          0 0 10px #00e5ff,
          0 0 20px #00e5ff;
      }

      20% {
        text-shadow:
          0 0 2px #ffffff,
          0 0 12px #00e5ff,
          0 0 25px #00e5ff,
          0 0 40px #00e5ff;
      }

      21% { text-shadow: none; }

      22% {
        text-shadow:
          0 0 8px #ffffff,
          0 0 18px #00e5ff,
          0 0 35px #00e5ff;
      }
    }

    @keyframes glitch1 {
      0%,90%,100% { opacity: 0; }
      20% { opacity: 0.8; }
      21% { opacity: 0; }
      60% { opacity: 0.6; }
    }

    @keyframes glitch2 {
      0%,88%,100% { opacity: 0; }
      30% { opacity: 0.7; }
      31% { opacity: 0; }
      75% { opacity: 0.5; }
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 160px 1fr 1fr 220px;
      grid-template-rows: 170px 150px 170px;
      gap: 8px;
      width: 100%;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      opacity: 0;
      transform: translateX(-20px);
      animation: dashboardEnter 0.7s ease forwards;
    }

    .card:hover {
      box-shadow:
        0 0 10px rgba(0,229,255,0.2),
        0 0 20px rgba(0,229,255,0.1);
      transition: 0.3s ease;
    }

    .panel-logo { animation-delay: 0ms; }
    .panel-harian { animation-delay: 100ms; }
    .panel-silage { animation-delay: 200ms; }
    .panel-kendaraan { animation-delay: 300ms; }
    .panel-tebon { animation-delay: 400ms; }
    .panel-odot-main { animation-delay: 500ms; }
    .panel-odot-chart { animation-delay: 600ms; }
    .panel-bk { animation-delay: 700ms; }
    .panel-supplier { animation-delay: 800ms; }

    @keyframes dashboardEnter {
      from {
        opacity: 0;
        transform: translateX(-20px);
        filter: brightness(0.7);
      }

      to {
        opacity: 1;
        transform: translateX(0);
        filter: brightness(1);
      }
    }

    .card-header {
      background: var(--bg-card-header);
      text-align: center;
      padding: 6px;
      font-weight: bold;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .card-body {
      padding: 8px;
      height: calc(100% - 28px);
    }

    .panel-logo { grid-column: 1; grid-row: 1 / 3; }
    .panel-harian { grid-column: 2; grid-row: 1; }
    .panel-silage { grid-column: 3; grid-row: 1; }
    .panel-kendaraan { grid-column: 4; grid-row: 1 / 3; }
    .panel-tebon { grid-column: 2; grid-row: 2; }
    .panel-odot-main { grid-column: 3; grid-row: 2; }
    .panel-odot-chart { grid-column: 1 / 3; grid-row: 3; }
    .panel-bk { grid-column: 3; grid-row: 3; }
    .panel-supplier { grid-column: 4; grid-row: 3; }

    .logo-wrapper {
      width: 120px;
      margin: 18px auto 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-img {
      width: 100%;
      height: auto;
      object-fit: contain;
      filter:
        drop-shadow(0 0 8px rgba(0,255,120,0.4))
        drop-shadow(0 0 18px rgba(0,255,120,0.2));
      animation: logoFloat 3s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }

    .company-name {
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      margin-top: 8px;
    }

    .dashboard-label {
      text-align: center;
      color: var(--text-muted);
      margin-top: 28px;
      font-size: 16px;
      font-weight: bold;
    }

    .doughnut-container {
      position: relative;
      height: 100px;
      width: 100%;
    }

    .doughnut-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
    }

    .note-value {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin-top: 4px;
    }

    .big-number-main {
      font-size: 56px;
      font-weight: bold;
      text-align: center;
      line-height: 1;
      margin-top: 26px;
    }

    .kendaraan-time {
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      margin: 14px 0 8px;
    }

    .kendaraan-chart {
      height: 98px;
    }

    canvas {
      max-width: 100%;
      max-height: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 10px;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 4px;
    }

    th {
      background: var(--bg-card-header);
    }

    .text-red { color: var(--accent-red); }
    .text-cyan { color: var(--accent-cyan); }
    .text-orange { color: var(--accent-orange); }

    @media (max-width:1200px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
      }

      .card {
        grid-column: auto !important;
        grid-row: auto !important;
        min-height: 220px;
      }
    }
  </style>
</head>

<body>

  <div class="header-title">KEDATANGAN PAKAN</div>

  <div class="dashboard-grid">

    <div class="card panel-logo">
      <div class="card-body">
        <div class="logo-wrapper">
          <img src="Logo BRK JPG.jpg" alt="Logo BRK" class="logo-img">
        </div>

        <div class="company-name">PT BUMI ROJO KOYO</div>
        <div class="dashboard-label">DASHBOARD</div>
      </div>
    </div>

    <div class="card panel-harian">
      <div class="card-header">HARIAN</div>
      <div class="card-body">
        <div class="doughnut-container">
          <canvas id="chartHarian"></canvas>
          <div class="doughnut-text text-red" id="val-harian-percent">0.00%</div>
        </div>
        <div class="note-value text-red" id="val-note">0</div>
      </div>
    </div>

    <div class="card panel-silage">
      <div class="card-header">SILAGE</div>
      <div class="card-body">
        <div class="doughnut-container">
          <canvas id="chartSilage"></canvas>
          <div class="doughnut-text" id="val-silage-percent">0.00%</div>
        </div>
        <div class="note-value" id="val-silage">0</div>
      </div>
    </div>

    <div class="card panel-kendaraan">
      <div class="card-header">EST. END PROCESS</div>
      <div class="card-body">
        <div class="kendaraan-time" id="val-waktu">Memuat...</div>

        <div class="doughnut-container kendaraan-chart">
          <canvas id="chartKendaraan"></canvas>
          <div class="doughnut-text" style="font-size:28px;" id="val-total-kendaraan">0</div>
        </div>

        <table style="margin-top:12px;">
          <tr>
            <th class="text-cyan">PICKUP</th>
            <th>ENGKEL</th>
            <th class="text-orange">TRUK</th>
            <th class="text-red">TOTAL</th>
          </tr>
          <tr>
            <td id="val-pickup">0</td>
            <td id="val-engkel">0</td>
            <td id="val-truk">0</td>
            <td class="text-red" id="val-total-tabel">0</td>
          </tr>
        </table>
      </div>
    </div>

    <div class="card panel-tebon">
      <div class="card-header">TEBON JAGUNG</div>
      <div class="card-body">
        <div class="big-number-main" id="val-tebon">0</div>
      </div>
    </div>

    <div class="card panel-odot-main">
      <div class="card-header">RUMPUT ODOT</div>
      <div class="card-body">
        <div class="big-number-main" id="val-odot">0</div>
      </div>
    </div>

    <div class="card panel-odot-chart">
      <div class="card-header">REPORT RUMPUT ODOT</div>
      <div class="card-body">
        <canvas id="chartOdot"></canvas>
      </div>
    </div>

    <div class="card panel-bk">
      <div class="card-header">BAHAN KERING</div>
      <div class="card-body">
        <table>
          <thead>
            <tr>
              <th>KOMODITI</th>
              <th>SUPPLIER</th>
              <th>NETTO</th>
            </tr>
          </thead>
          <tbody id="table-bk"></tbody>
        </table>
      </div>
    </div>

    <div class="card panel-supplier">
      <div class="card-header">REPORT SUPPLIER BK</div>
      <div class="card-body">
        <canvas id="chartSupplier"></canvas>
      </div>
    </div>

  </div>

  <script>
    const URL_API = "https://script.google.com/macros/s/AKfycby8n40jTJ1Eo6Vd8uCXflhHGLC_0TSMu3k6Blo8vSiYjS5uE5McDAfV_sLJovp7wkGnyQ/exec";

    Chart.defaults.color = '#a0a0c0';
    Chart.defaults.borderColor = '#3f4069';

    const chartHarian = new Chart(document.getElementById('chartHarian'), {
      type: 'doughnut',
      data: {
        datasets: [{
          data: [0, 100],
          backgroundColor: ['#ff5252', '#00e5ff'],
          borderWidth: 0
        }]
      },
      options: {
        cutout: '78%',
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } }
      }
    });

    const chartSilage = new Chart(document.getElementById('chartSilage'), {
      type: 'doughnut',
      data: {
        datasets: [{
          data: [0, 100],
          backgroundColor: ['#ffffff', '#3f4069'],
          borderWidth: 0
        }]
      },
      options: {
        cutout: '78%',
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } }
      }
    });

    const chartKendaraan = new Chart(document.getElementById('chartKendaraan'), {
      type: 'doughnut',
      data: {
        labels: ['Pickup', 'Engkel', 'Truk'],
        datasets: [{
          data: [0, 0, 0],
          backgroundColor: ['#00e5ff', '#353660', '#ff9100'],
          borderWidth: 2,
          borderColor: '#1e1e38'
        }]
      },
      options: {
        cutout: '72%',
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } }
      }
    });

    const chartOdot = new Chart(document.getElementById('chartOdot'), {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Rumput Odot',
          data: [],
          borderColor: '#ffff00',
          backgroundColor: 'rgba(255,255,0,0.08)',
          fill: false,
          tension: 0.35,
          pointRadius: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: { boxWidth: 14, font: { size: 8 } }
          }
        },
        scales: {
          y: { beginAtZero: true, ticks: { font: { size: 8 } } },
          x: {
            ticks: {
              font: { size: 8 },
              maxRotation: 45,
              minRotation: 45
            }
          }
        }
      }
    });

    const chartSupplier = new Chart(document.getElementById('chartSupplier'), {
      type: 'pie',
      data: {
        labels: ['Salasin', 'Aminoto', 'Sandry', 'Frengky'],
        datasets: [{
          data: [0, 0, 0, 0],
          backgroundColor: ['#ff9100', '#00e5ff', '#ffffff', '#ffff00']
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: { font: { size: 8 }, boxWidth: 12 }
          }
        }
      }
    });

    function formatAngka(v) {
      return Number(v || 0).toLocaleString('id-ID');
    }

    function safePercent(v) {
      let n = Math.abs(Number(v) || 0);
      if (n > 100) n = 100;
      return n;
    }

    function sum(arr) {
      if (!arr || !Array.isArray(arr)) return 0;
      return arr.reduce((a, b) => a + Number(b || 0), 0);
    }

    function renderBahanKering(rows) {
      const tbody = document.getElementById("table-bk");
      tbody.innerHTML = "";

      if (!rows || rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3">Tidak ada data</td></tr>`;
        return;
      }

      rows.forEach(row => {
        tbody.innerHTML += `
          <tr>
            <td>${row.komoditi}</td>
            <td>${row.supplier}</td>
            <td>${row.netto}</td>
          </tr>
        `;
      });
    }

    function fetchData() {
      fetch(URL_API)
        .then(res => res.json())
        .then(data => {
          document.getElementById('val-waktu').innerText = data.estEndProcess || "-";
          document.getElementById('val-tebon').innerText = formatAngka(data.tebonJagung);
          document.getElementById('val-odot').innerText = formatAngka(data.rumputOdot);
          document.getElementById('val-note').innerText = formatAngka(data.note);

          let harianPercent = Number(data.harianPercent || 0);
          document.getElementById('val-harian-percent').innerText = harianPercent.toFixed(2) + "%";

          chartHarian.data.datasets[0].data = [
            safePercent(harianPercent),
            100 - safePercent(harianPercent)
          ];
          chartHarian.update();

          let silagePercent = Number(data.silagePercent || 0);
          document.getElementById('val-silage').innerText = formatAngka(data.silage);
          document.getElementById('val-silage-percent').innerText = silagePercent.toFixed(2) + "%";

          chartSilage.data.datasets[0].data = [
            safePercent(silagePercent),
            100 - safePercent(silagePercent)
          ];
          chartSilage.update();

          let k = data.kendaraan || {};

          document.getElementById('val-pickup').innerText = k.pickup || 0;
          document.getElementById('val-engkel').innerText = k.engkel || 0;
          document.getElementById('val-truk').innerText = k.truk || 0;
          document.getElementById('val-total-tabel').innerText = k.total || 0;
          document.getElementById('val-total-kendaraan').innerText = k.total || 0;

          chartKendaraan.data.datasets[0].data = [
            k.pickup || 0,
            k.engkel || 0,
            k.truk || 0
          ];
          chartKendaraan.update();

          let pv = data.pivot || {
            labels: [],
            sumKedatangan: []
          };

          chartOdot.data.labels = pv.labels || [];
          chartOdot.data.datasets[0].data = pv.sumKedatangan || [];
          chartOdot.update();

          let bk = data.monthlyBK || {
            salasin: [],
            aminoto: [],
            sandry: [],
            frengky: []
          };

          chartSupplier.data.datasets[0].data = [
            sum(bk.salasin),
            sum(bk.aminoto),
            sum(bk.sandry),
            sum(bk.frengky)
          ];
          chartSupplier.update();

          renderBahanKering(data.bahanKering);
        })
        .catch(err => {
          console.error(err);
          document.getElementById('val-waktu').innerText = "Koneksi Terputus";
          document.getElementById('val-waktu').style.color = "red";
        });
    }

    fetchData();
    setInterval(fetchData, 60000);
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("service-worker.js")
          .then(function () {
            console.log("Service Worker aktif");
          })
          .catch(function (error) {
            console.log("Service Worker gagal:", error);
          });
      });
    }
  </script>

</body>
</html>
